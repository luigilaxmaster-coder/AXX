name: Desktop version consistency
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python scripts/release.py check
      - run: python -m unittest discover -s scripts -p test_release.py -v
      - run: python -m pip install Pillow==12.1.1 psutil==7.2.2 -r requirements-mobile.txt
      - name: Install mission browser test runtime
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.64.1
      - run: npx --no-install playwright install chromium
      - name: Typed mission review browser contracts
        run: node 1.AXX/scripts/test-action-learning.cjs --goal-ui
      - name: Command review browser contracts
        run: node 1.AXX/scripts/test-command-library.cjs
      - name: Scoped memory browser contracts
        run: node 1.AXX/scripts/test-task-memory.cjs
      - name: Document reference review browser contracts
        run: node 1.AXX/scripts/test-document-provenance.cjs
      - name: Mobile history generation browser contracts
        run: node 1.AXX/scripts/test-mobile-pairing.cjs
      - name: Anticipation review browser contracts
        run: node 1.AXX/scripts/test-anticipation.cjs
      - name: Mission activity and requested response contracts
        run: node 1.AXX/scripts/test-mission-attention.cjs
      - name: Mission attention real file and HTTP UI flow
        run: node 1.AXX/scripts/test-mission-attention-integration.cjs
      - name: Explicit resource selection and review contracts
        run: node 1.AXX/scripts/test-resource-bindings.cjs
      - name: Resource origins, file leases and authenticated binding
        run: python -m unittest backend.tests.test_resource_bindings backend.tests.test_resource_binding_http -q
      - name: Mission attention policy and durable admission
        run: python -m unittest backend.tests.test_mission_attention backend.tests.test_anticipation backend.tests.test_anticipation_http -q
      - name: Inference routing and worker regressions
        run: python -m unittest discover -s backend/inference/tests -q
      - name: Planning, privacy and command regressions
        run: python -m unittest backend.tests.test_prompts backend.tests.test_command_language backend.tests.test_command_sequences backend.tests.test_action_learning backend.tests.test_goal_cycle backend.tests.test_command_library backend.tests.test_provider_settings backend.tests.test_mission_model_budget backend.tests.test_planning_context backend.tests.test_source_destinations backend.tests.test_source_dispatch backend.tests.test_anticipation_context_sources -q
      - name: Mission outcomes and bounded continuation
        run: python -m unittest backend.tests.test_goal_criteria backend.tests.test_goal_progress backend.tests.test_goal_progress_holdout backend.tests.test_goal_progress_input_race backend.tests.test_anticipation_goal_progress backend.tests.test_missions backend.tests.test_mission_dispatch -q
      - name: Scoped forgetting and memory corrections
        run: python -m unittest backend.tests.test_task_memory backend.tests.test_command_task_memory backend.tests.test_skill_task_memory backend.tests.test_chat_forgetting backend.tests.test_selection_policy backend.tests.test_session_memory backend.tests.test_workshop_task_memory backend.tests.test_anticipation_task_memory backend.tests.test_legacy_task_memory backend.tests.test_memory_http backend.tests.test_telegram_task_memory -q
      - name: Forgotten mission public projection
        run: python -m unittest backend.tests.test_forgotten_plan_projection -q
      - name: Mobile mission correction and durable ownership
        run: python -m unittest backend.tests.test_mission_corrections backend.mobile.tests.test_missions backend.tests.test_mobile_mission_flow -q
      - name: Mobile mission review and lost acknowledgement contracts
        run: node mobile/tests/test-mission-continuity.cjs
      - name: Document integrity, learning and verified reuse
        run: python -m unittest backend.tests.test_document_references backend.tests.test_reference_library backend.tests.test_procedure_integration backend.tests.test_document_skill_learning backend.tests.test_document_lesson_provenance backend.tests.test_workshop_document_provenance backend.tests.test_document_reference_http backend.tests.test_skill_learning backend.tests.test_skill_context backend.tests.test_revalidation backend.tests.test_skills_http backend.tests.test_capability_workshop backend.tests.test_capability_workshop_http -q
      - name: Connect memory and compatibility regressions
        run: python -m unittest discover -s backend/connect/tests -q
      - name: Telegram and desktop command regressions
        run: python -m unittest backend.tests.test_commands_remote_confirmation backend.tests.test_telegram_confirmation backend.tests.test_telegram_confirmation_integration backend.tests.test_telegram_bot backend.tests.test_telegram_bot_setup backend.tests.test_telegram_catalog backend.tests.test_telegram_service backend.tests.test_telegram_daemon backend.tests.test_telegram_miniapp backend.tests.test_telegram_http backend.tests.test_window_title_scope backend.tests.test_desktop_commands -q
      - name: Prompt browser contracts
        run: node scripts/test-prompt-contracts.cjs
