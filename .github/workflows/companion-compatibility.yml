name: Desktop and phone compatibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  companion:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-companion-tests.txt
      - run: python -m playwright install chromium
      - name: Require paired source, design and browser contracts
        run: python scripts/validate_companion.py --output build/companion-validation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: companion-source-validation
          path: build/companion-validation.json
          if-no-files-found: error
